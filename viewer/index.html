<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR Inmersión — Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #app { width: 100%; height: 100%; }
      #sound-toggle {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        padding: 10px 16px;
        border: 1px solid rgba(245, 230, 200, 0.4);
        border-radius: 8px;
        background: rgba(15, 15, 10, 0.75);
        color: #f5e6c8;
        font: 14px sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button id="sound-toggle">🔊 Activar sonido ambiente</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
